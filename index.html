<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flash Lab Uni · Libretto Universitario</title>

    <!-- ============ PWA META TAGS ============ -->
    <meta name="theme-color" content="#004a99">
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FlashLab">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23004a99'/%3E%3Ctext x='50' y='68' font-family='Arial' font-size='50' font-weight='bold' fill='white' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
    
    <style>
        /* ============ CSS ESISTENTE (INVARIATO) ============ */
        :root {
            --primary: #004a99;
            --primary-light: #1a6bc4;
            --primary-dark: #003366;
            --bg-main: #f0f2f5;
            --bg-card: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #5a5a7a;
            --text-muted: #8b8ba7;
            --accent-green: #22c55e;
            --accent-yellow: #f59e0b;
            --accent-red: #ef4444;
            --accent-purple: #8b5cf6;
            --border-light: #e5e7eb;
            --shadow-sm: 0 2px 8px rgba(0, 74, 153, 0.08);
            --shadow-md: 0 4px 16px rgba(0, 74, 153, 0.12);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: all 0.3s ease;
            --tab-height: 64px;
            --header-height: 60px;
            --font-sans: 'Segoe UI', -apple-system, sans-serif;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: var(--font-sans);
            background: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.6;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            padding-bottom: calc(var(--tab-height) + 20px);
        }
        
        .app-header {
            position: sticky; top: 0; z-index: 100;
            background: var(--primary); color: white;
            padding: 16px 20px; display: flex;
            align-items: center; justify-content: space-between;
            min-height: var(--header-height);
        }
        .app-header .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.2rem; }
        .app-header .logo svg { width: 28px; height: 28px; fill: white; }
        .header-icon { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .header-icon svg { width: 20px; height: 20px; fill: white; }
        
        .main-content { padding: 16px; }
        .tab-bar {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px; height: var(--tab-height);
            background: var(--bg-card); border-top: 1px solid var(--border-light);
            display: flex; align-items: center; justify-content: space-around;
            z-index: 1000;
        }
        .tab-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 12px; border: none; background: none; cursor: pointer; color: var(--text-muted); font-size: 0.65rem; font-weight: 600; }
        .tab-item svg { width: 22px; height: 22px; fill: currentColor; }
        .tab-item.active { color: var(--primary); }
        
        .card { background: var(--bg-card); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow-sm); }
        .card-title { font-size: 1rem; font-weight: 700; color: var(--primary); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .stat-card { background: var(--bg-card); border-radius: var(--radius-md); padding: 16px; text-align: center; border: 1px solid var(--border-light); }
        .stat-value { font-size: 1.8rem; font-weight: 800; color: var(--primary); }
        .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
        
        .btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border-radius: var(--radius-sm); font-weight: 700; font-size: 0.85rem; cursor: pointer; border: none; width: 100%; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        
        .form-group { margin-bottom: 14px; }
        .form-label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
        .form-input, .form-select { width: 100%; padding: 12px 14px; border: 2px solid var(--border-light); border-radius: var(--radius-sm); font-size: 0.9rem; }
        
        .hidden { display: none !important; }
        .text-center { text-align: center; }
        .mt-16 { margin-top: 16px; }
        .mb-16 { margin-bottom: 16px; }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        
        /* Nuovi stili */
        .progress-bar { background: #e5e7eb; border-radius: 10px; height: 10px; overflow: hidden; margin: 8px 0; }
        .progress-fill { background: var(--primary); height: 100%; border-radius: 10px; transition: width 0.5s ease; }
        .badge { display: inline-block; background: var(--primary); color: white; padding: 4px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: 600; margin: 2px; }
        .goal-card { background: rgba(0, 74, 153, 0.05); border: 1px solid var(--primary); border-radius: var(--radius-md); padding: 12px; margin-bottom: 12px; }
    </style>
</head>
<body>
    
    <!-- HEADER -->
    <header class="app-header">
        <div class="logo">
            <svg viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/></svg>
            Flash Lab Uni
        </div>
        <div class="header-icon" onclick="openSettings()">
            <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.04.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.57 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.21.08-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
        </div>
    </header>
    
    <main class="main-content">
        
        <!-- DASHBOARD -->
        <div id="page-dashboard" class="page active">
            <div class="card">
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-value" id="stat-media">—</div><div class="stat-label">Media</div></div>
                    <div class="stat-card"><div class="stat-value" id="stat-cfu">0</div><div class="stat-label">CFU</div></div>
                    <div class="stat-card"><div class="stat-value" id="stat-esami">0</div><div class="stat-label">Esami</div></div>
                    <div class="stat-card"><div class="stat-value" id="stat-voto-base">—</div><div class="stat-label">Voto Base</div></div>
                </div>
                
                <!-- OBIETTIVO -->
                <div class="goal-card" id="obiettivo-card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <strong style="font-size:0.85rem;">🎯 Obiettivo: Media <span id="obiettivo-valore">28</span></strong>
                        <button onclick="cambiaObiettivo()" style="background:none; border:none; cursor:pointer; font-size:0.8rem;">✏️</button>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="obiettivo-progresso" style="width:0%;"></div>
                    </div>
                    <p style="font-size:0.75rem; color:var(--text-muted);" id="obiettivo-messaggio">Inserisci esami per vedere il progresso</p>
                </div>
                
                <!-- AI TUTOR -->
                <div style="background:rgba(139,92,246,0.1); border:1px solid #8b5cf6; border-radius:12px; padding:12px; margin-bottom:12px;">
                    <strong style="font-size:0.85rem;">🤖 AI Tutor:</strong>
                    <p style="font-size:0.8rem; margin-top:4px;" id="ai-tutor">Inserisci esami per ricevere consigli!</p>
                </div>
            </div>
            
            <div class="card">
                <div class="card-title">📚 I Miei Esami</div>
                <div id="lista-esami-dashboard"></div>
                <button class="btn btn-primary" onclick="showAddExam()">➕ Aggiungi Esame</button>
            </div>
        </div>
        
        <!-- ANDAMENTO -->
        <div id="page-andamento" class="page hidden">
            <div class="card">
                <div class="card-title">📈 Andamento Carriera</div>
                <div class="chart-container" id="chart-andamento" style="display:flex; gap:4px; overflow-x:auto; padding:16px 0;"></div>
            </div>
        </div>
        
        <!-- PREVISIONI -->
        <div id="page-previsioni" class="page hidden">
            <div class="card">
                <div class="card-title">🔮 Previsioni e Laurea</div>
                <div class="form-group"><label class="form-label">Voto previsto</label><input type="number" id="prev-voto" class="form-input" placeholder="28" min="18" max="33"></div>
                <div class="form-group"><label class="form-label">CFU prossimo esame</label><input type="number" id="prev-cfu" class="form-input" placeholder="12" min="1" max="30"></div>
                <button class="btn btn-primary" onclick="calcolaPrevisione()">Calcola Previsione</button>
                <div id="previsione-risultato" class="mt-16 text-center" style="font-size:1.1rem; font-weight:700;"></div>
                
                <hr style="margin:20px 0; border:none; border-top:1px solid #e5e7eb;">
                
                <div class="form-group"><label class="form-label">🎯 Punti tesi (0-8)</label><input type="number" id="laurea-tesi" class="form-input" value="5" min="0" max="8"></div>
                <div class="form-group"><label class="form-label">🏆 Bonus (0-10)</label><input type="number" id="laurea-bonus" class="form-input" value="0" min="0" max="10"></div>
                <button class="btn btn-primary" onclick="calcolaVotoLaurea()">🎓 Calcola Voto Laurea</button>
                <div id="laurea-risultato" class="mt-16 text-center" style="font-size:1.5rem; font-weight:800;"></div>
            </div>
        </div>
        
        <!-- TASSE -->
        <div id="page-tasse" class="page hidden">
            <div class="card">
                <div class="card-title">💰 Gestione Tasse</div>
                <div id="prossima-scadenza" class="mb-16"></div>
                <div id="lista-tasse"></div>
                <button class="btn btn-primary" onclick="showAddTassa()">➕ Aggiungi Tassa</button>
            </div>
        </div>
        
        <!-- ORARIO -->
        <div id="page-orario" class="page hidden">
            <div class="card">
                <div class="card-title">📅 Orario Settimanale</div>
                <div id="filtri-giorni" style="display:flex; gap:8px; overflow-x:auto; margin-bottom:12px;"></div>
                <div id="lista-orario"></div>
                <button class="btn btn-primary" onclick="showAddOrario()">➕ Aggiungi Impegno</button>
            </div>
        </div>
        
        <!-- DOMANDE -->
        <div id="page-domande" class="page hidden">
            <div class="card">
                <div class="card-title">❓ Domande d'Esame</div>
                <div class="form-group"><label class="form-label">Materia</label><input type="text" id="domanda-materia" class="form-input" placeholder="es. Storia"></div>
                <div class="form-group"><label class="form-label">Domanda</label><textarea id="domanda-testo" class="form-input" rows="3" placeholder="Scrivi la domanda..."></textarea></div>
                <button class="btn btn-primary" onclick="aggiungiDomanda()">Condividi</button>
                <div id="lista-domande" class="mt-16"></div>
            </div>
        </div>
    </main>
    
    <!-- TAB BAR -->
    <nav class="tab-bar">
        <button class="tab-item active" onclick="navigateTo('dashboard')" data-tab="dashboard">🏠 Home</button>
        <button class="tab-item" onclick="navigateTo('andamento')" data-tab="andamento">📈 Andamento</button>
        <button class="tab-item" onclick="navigateTo('previsioni')" data-tab="previsioni">🔮 Previsioni</button>
        <button class="tab-item" onclick="navigateTo('tasse')" data-tab="tasse">💰 Tasse</button>
        <button class="tab-item" onclick="navigateTo('orario')" data-tab="orario">📅 Orario</button>
        <button class="tab-item" onclick="navigateTo('domande')" data-tab="domande">❓ Domande</button>
    </nav>
    
    <script>
        // ============ DATA LAYER ============
        let esami = JSON.parse(localStorage.getItem('flashlab_esami') || '[]');
        let tasse = JSON.parse(localStorage.getItem('flashlab_tasse') || '[]');
        let orario = JSON.parse(localStorage.getItem('flashlab_orario') || '[]');
        let domande = JSON.parse(localStorage.getItem('flashlab_domande') || '[]');
        let obiettivoMedia = parseInt(localStorage.getItem('flashlab_obiettivo') || '28');
        
        const PAGES = ['dashboard', 'andamento', 'previsioni', 'tasse', 'orario', 'domande'];
        let currentPage = 'dashboard';
        
        // ============ NAVIGAZIONE ============
        function navigateTo(page) {
            PAGES.forEach(p => document.getElementById('page-' + p).classList.add('hidden'));
            document.getElementById('page-' + page).classList.remove('hidden');
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            document.querySelector(`[data-tab="${page}"]`).classList.add('active');
            currentPage = page;
            updatePage(page);
        }
        
        function updatePage(page) {
            if (page === 'dashboard') renderDashboard();
            if (page === 'andamento') renderChart();
            if (page === 'tasse') renderTasse();
            if (page === 'orario') renderOrario();
            if (page === 'domande') renderDomande();
        }
        
        // ============ CALCOLI ============
        function calcolaMediaPonderata() {
            if (esami.length === 0) return 0;
            const cfu = esami.reduce((s, e) => s + e.cfu, 0);
            const somma = esami.reduce((s, e) => s + (e.voto * e.cfu), 0);
            return cfu > 0 ? somma / cfu : 0;
        }
        
        function calcolaCFU() { return esami.reduce((s, e) => s + e.cfu, 0); }
        
        function calcolaVotoBase() {
            const media = calcolaMediaPonderata();
            return media > 0 ? (media * 110) / 30 : 0;
        }
        
        // ============ AI TUTOR ============
        function getAITutor() {
            const media = calcolaMediaPonderata();
            if (media === 0) return 'Inserisci i tuoi esami per ricevere consigli personalizzati! 📚';
            if (media < 24) return '📚 Concentrati sulle basi: ripassa le materie fondamentali e chiedi aiuto ai tutor.';
            if (media < 26) return '🎯 Sei sulla buona strada! Punta a migliorare gli esami con più CFU.';
            if (media < 28) return '🔥 Ottimo lavoro! Puoi puntare al 110 con un po\' di impegno in più.';
            if (media < 29.5) return '🏆 Eccellente! Sei da lode! Mantieni questo ritmo!';
            return '👑 Straordinario! Media da 110 e lode garantita!';
        }
        
        // ============ OBIETTIVO ============
        function cambiaObiettivo() {
            const nuovo = prompt('🎯 Inserisci la media obiettivo (es. 28):', obiettivoMedia);
            if (nuovo && !isNaN(nuovo) && nuovo >= 18 && nuovo <= 33) {
                obiettivoMedia = parseInt(nuovo);
                localStorage.setItem('flashlab_obiettivo', obiettivoMedia);
                renderDashboard();
            }
        }
        
        // ============ DASHBOARD ============
        function renderDashboard() {
            const media = calcolaMediaPonderata();
            const cfu = calcolaCFU();
            const votoBase = calcolaVotoBase();
            
            document.getElementById('stat-media').textContent = media > 0 ? media.toFixed(2) : '—';
            document.getElementById('stat-cfu').textContent = cfu;
            document.getElementById('stat-esami').textContent = esami.length;
            document.getElementById('stat-voto-base').textContent = votoBase > 0 ? votoBase.toFixed(1) : '—';
            
            // Obiettivo
            document.getElementById('obiettivo-valore').textContent = obiettivoMedia;
            const progresso = media > 0 ? Math.min((media / obiettivoMedia) * 100, 100) : 0;
            document.getElementById('obiettivo-progresso').style.width = progresso + '%';
            document.getElementById('obiettivo-messaggio').textContent = 
                media > 0 ? `Progresso: ${progresso.toFixed(0)}% verso l'obiettivo` : 'Inserisci esami per vedere il progresso';
            
            // AI Tutor
            document.getElementById('ai-tutor').textContent = getAITutor();
            
            // Lista esami
            const lista = document.getElementById('lista-esami-dashboard');
            if (esami.length === 0) {
                lista.innerHTML = '<div class="empty-state"><p>Nessun esame inserito</p></div>';
                return;
            }
            
            lista.innerHTML = [...esami].sort((a,b) => b.data.localeCompare(a.data)).map(e => `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:12px; border-left:3px solid ${e.voto >= 28 ? 'green' : e.voto >= 24 ? 'orange' : 'red'}; margin-bottom:8px; background:white; border-radius:8px;">
                    <div><strong>${e.nome}</strong><br><small>CFU: ${e.cfu} · ${e.data}</small></div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <strong>${e.voto}</strong>
                        <button onclick="rimuoviEsame(${e.id})" style="background:none; border:none; cursor:pointer;">🗑️</button>
                    </div>
                </div>
            `).join('');
        }
        
        // ============ CHART ============
        function renderChart() {
            const container = document.getElementById('chart-andamento');
            if (esami.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>Inserisci esami per vedere il grafico</p></div>';
                return;
            }
            
            const sorted = [...esami].sort((a,b) => a.data.localeCompare(b.data));
            container.innerHTML = sorted.map(e => {
                const h = ((e.voto - 15) / 18) * 100;
                return `<div style="text-align:center; min-width:40px;">
                    <div style="background:${e.voto >= 28 ? 'green' : e.voto >= 24 ? 'orange' : 'red'}; height:${h}px; border-radius:4px 4px 0 0;"></div>
                    <small>${e.nome.substring(0,5)}</small>
                </div>`;
            }).join('');
        }
        
        // ============ PREVISIONI E LAUREA ============
        function calcolaPrevisione() {
            const voto = parseInt(document.getElementById('prev-voto').value);
            const cfu = parseInt(document.getElementById('prev-cfu').value);
            if (!voto || !cfu) { alert('Inserisci voto e CFU'); return; }
            
            const cfuAtt = calcolaCFU();
            const sommaAtt = esami.reduce((s,e) => s + (e.voto * e.cfu), 0);
            const nuovaMedia = (sommaAtt + (voto * cfu)) / (cfuAtt + cfu);
            const mediaAtt = calcolaMediaPonderata();
            const diff = nuovaMedia - mediaAtt;
            
            document.getElementById('previsione-risultato').innerHTML = 
                `Media attuale: ${mediaAtt.toFixed(2)}<br>Media prevista: <strong>${nuovaMedia.toFixed(2)}</strong><br>
                <span style="color:${diff >= 0 ? 'green' : 'red'}">${diff >= 0 ? '↑' : '↓'} ${Math.abs(diff).toFixed(2)} punti</span>`;
        }
        
        function calcolaVotoLaurea() {
            const tesi = parseInt(document.getElementById('laurea-tesi').value) || 0;
            const bonus = parseInt(document.getElementById('laurea-bonus').value) || 0;
            const votoBase = calcolaVotoBase();
            
            if (votoBase === 0) {
                document.getElementById('laurea-risultato').textContent = 'Inserisci esami prima';
                return;
            }
            
            const finale = Math.min(votoBase + tesi + bonus, 110);
            document.getElementById('laurea-risultato').innerHTML = 
                `🎓 Voto finale: <span style="color:#004a99;">${finale.toFixed(1)}</span>${finale >= 110 ? ' 🎉 LODE!' : ''}`;
        }
        
        // ============ ESAMI ============
        function aggiungiEsame() {
            const nome = document.getElementById('esame-nome').value.trim();
            const voto = parseInt(document.getElementById('esame-voto').value);
            const cfu = parseInt(document.getElementById('esame-cfu').value);
            const data = document.getElementById('esame-data').value || new Date().toISOString().split('T')[0];
            
            if (!nome || !voto || !cfu) { alert('Compila tutti i campi'); return; }
            
            esami.push({ id: Date.now(), nome, voto, cfu, data });
            localStorage.setItem('flashlab_esami', JSON.stringify(esami));
            closeModal();
            renderDashboard();
            renderChart();
        }
        
        function rimuoviEsame(id) {
            if (confirm('Eliminare questo esame?')) {
                esami = esami.filter(e => e.id !== id);
                localStorage.setItem('flashlab_esami', JSON.stringify(esami));
                renderDashboard();
                renderChart();
            }
        }
        
        // ============ TASSE ============
        function renderTasse() {
            const lista = document.getElementById('lista-tasse');
            const prossima = document.getElementById('prossima-scadenza');
            
            if (tasse.length === 0) {
                lista.innerHTML = '<div class="empty-state"><p>Nessuna tassa</p></div>';
                prossima.innerHTML = '';
                return;
            }
            
            const nonPagate = tasse.filter(t => !t.pagata).sort((a,b) => a.scadenza.localeCompare(b.scadenza));
            if (nonPagate.length > 0) {
                const p = nonPagate[0];
                prossima.innerHTML = `<div style="background:rgba(245,158,11,0.1); padding:12px; border-radius:8px; text-align:center;">
                    <strong>⚠️ Prossima scadenza:</strong><br>${p.descrizione} · €${p.importo} · ${p.scadenza}</div>`;
            } else {
                prossima.innerHTML = '<div class="text-center" style="color:green;">✅ Tutte pagate!</div>';
            }
            
            lista.innerHTML = tasse.map(t => `
                <div style="display:flex; justify-content:space-between; padding:12px; border-left:3px solid ${t.pagata ? 'green' : 'orange'}; margin-bottom:8px; background:white; border-radius:8px;">
                    <div><strong>${t.descrizione}</strong><br><small>€${t.importo} · ${t.scadenza}</small></div>
                    <div style="display:flex; gap:8px;">
                        <button onclick="toggleTassa(${t.id})" style="background:none; border:none; cursor:pointer;">${t.pagata ? '✅' : '⬜'}</button>
                        <button onclick="rimuoviTassa(${t.id})" style="background:none; border:none; cursor:pointer;">🗑️</button>
                    </div>
                </div>
            `).join('');
        }
        
        // ============ ORARIO ============
        const GIORNI = ['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
        let giornoSel = GIORNI[0];
        
        function renderOrario() {
            document.getElementById('filtri-giorni').innerHTML = GIORNI.map(g => 
                `<button onclick="selezionaGiorno('${g}')" style="padding:6px 12px; border-radius:20px; border:1px solid #ddd; background:${g === giornoSel ? '#004a99' : 'white'}; color:${g === giornoSel ? 'white' : '#333'}; cursor:pointer; font-size:0.7rem;">${g.substring(0,3)}</button>`
            ).join('');
            
            const impegni = orario.filter(o => o.giorno === giornoSel);
            document.getElementById('lista-orario').innerHTML = impegni.length === 0 ? 
                `<div class="empty-state"><p>Nessun impegno per ${giornoSel}</p></div>` :
                impegni.map(o => `
                    <div style="display:flex; justify-content:space-between; padding:12px; margin-bottom:8px; background:white; border-radius:8px;">
                        <div><strong>${o.materia}</strong><br><small>${o.ora} · ${o.tipo}</small></div>
                        <button onclick="rimuoviOrario(${o.id})" style="background:none; border:none;">🗑️</button>
                    </div>
                `).join('');
        }
        
        // ============ DOMANDE ============
        function renderDomande() {
            const lista = document.getElementById('lista-domande');
            if (domande.length === 0) {
                lista.innerHTML = '<div class="empty-state"><p>Nessuna domanda</p></div>';
                return;
            }
            
            const materie = {};
            domande.forEach(d => { if (!materie[d.materia]) materie[d.materia] = []; materie[d.materia].push(d); });
            
            lista.innerHTML = Object.keys(materie).map(m => `
                <div style="margin-bottom:12px;">
                    <strong style="color:#004a99;">${m}</strong>
                    ${materie[m].map(d => `<p style="font-size:0.85rem; padding:8px; background:white; border-radius:8px; margin:4px 0;">${d.testo}</p>`).join('')}
                </div>
            `).join('');
        }
        
        // ============ MODALS ============
        function showAddExam() {
            document.body.insertAdjacentHTML('beforeend', `
                <div id="modal" style="position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:2000; display:flex; align-items:center; justify-content:center; padding:20px;">
                    <div style="background:white; border-radius:16px; padding:24px; width:100%; max-width:400px;">
                        <h3 style="margin-bottom:16px;">Aggiungi Esame</h3>
                        <input id="esame-nome" class="form-input" placeholder="Nome esame" style="margin-bottom:8px;">
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px;">
                            <input id="esame-voto" class="form-input" type="number" placeholder="Voto" min="18" max="33">
                            <input id="esame-cfu" class="form-input" type="number" placeholder="CFU" min="1" max="30">
                        </div>
                        <input id="esame-data" class="form-input" type="date" style="margin-bottom:16px;">
                        <button class="btn btn-primary" onclick="aggiungiEsame()">Salva</button>
                        <button class="btn btn-outline" onclick="document.getElementById('modal').remove()" style="margin-top:8px;">Annulla</button>
                    </div>
                </div>
            `);
        }
        
        function showAddTassa() {
            document.body.insertAdjacentHTML('beforeend', `
                <div id="modal" style="position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:2000; display:flex; align-items:center; justify-content:center; padding:20px;">
                    <div style="background:white; border-radius:16px; padding:24px; width:100%; max-width:400px;">
                        <h3 style="margin-bottom:16px;">Aggiungi Tassa</h3>
                        <input id="tassa-descrizione" class="form-input" placeholder="Descrizione" style="margin-bottom:8px;">
                        <input id="tassa-importo" class="form-input" type="number" placeholder="Importo €" style="margin-bottom:8px;">
                        <input id="tassa-scadenza" class="form-input" type="date" style="margin-bottom:16px;">
                        <button class="btn btn-primary" onclick="aggiungiTassa()">Salva</button>
                        <button class="btn btn-outline" onclick="document.getElementById('modal').remove()" style="margin-top:8px;">Annulla</button>
                    </div>
                </div>
            `);
        }
        
        function showAddOrario() {
            document.body.insertAdjacentHTML('beforeend', `
                <div id="modal" style="position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:2000; display:flex; align-items:center; justify-content:center; padding:20px;">
                    <div style="background:white; border-radius:16px; padding:24px; width:100%; max-width:400px;">
                        <h3 style="margin-bottom:16px;">Aggiungi Impegno</h3>
                        <input id="orario-materia" class="form-input" placeholder="Materia" style="margin-bottom:8px;">
                        <input id="orario-ora" class="form-input" type="time" style="margin-bottom:8px;">
                        <select id="orario-tipo" class="form-input" style="margin-bottom:16px;">
                            <option value="universitario">Universitario</option>
                            <option value="extra">Extra</option>
                        </select>
                        <button class="btn btn-primary" onclick="aggiungiOrario()">Salva</button>
                        <button class="btn btn-outline" onclick="document.getElementById('modal').remove()" style="margin-top:8px;">Annulla</button>
                    </div>
                </div>
            `);
        }
        
        function closeModal() {
            const modal = document.getElementById('modal');
            if (modal) modal.remove();
        }
        
        // ============ ALTRE FUNZIONI ============
        function aggiungiTassa() {
            const descrizione = document.getElementById('tassa-descrizione').value.trim();
            const importo = document.getElementById('tassa-importo').value;
            const scadenza = document.getElementById('tassa-scadenza').value;
            if (!importo || !scadenza) { alert('Compila i campi'); return; }
            tasse.push({ id: Date.now(), descrizione: descrizione || 'Tassa', importo: parseFloat(importo), scadenza, pagata: false });
            localStorage.setItem('flashlab_tasse', JSON.stringify(tasse));
            closeModal();
            renderTasse();
        }
        
        function toggleTassa(id) {
            const t = tasse.find(x => x.id === id);
            if (t) { t.pagata = !t.pagata; localStorage.setItem('flashlab_tasse', JSON.stringify(tasse)); renderTasse(); }
        }
        
        function rimuoviTassa(id) {
            if (confirm('Eliminare?')) { tasse = tasse.filter(t => t.id !== id); localStorage.setItem('flashlab_tasse', JSON.stringify(tasse)); renderTasse(); }
        }
        
        function aggiungiOrario() {
            const materia = document.getElementById('orario-materia').value.trim();
            const ora = document.getElementById('orario-ora').value;
            const tipo = document.getElementById('orario-tipo').value;
            if (!materia || !ora) { alert('Compila i campi'); return; }
            orario.push({ id: Date.now(), materia, ora, giorno: giornoSel, tipo });
            localStorage.setItem('flashlab_orario', JSON.stringify(orario));
            closeModal();
            renderOrario();
        }
        
        function rimuoviOrario(id) {
            if (confirm('Eliminare?')) { orario = orario.filter(o => o.id !== id); localStorage.setItem('flashlab_orario', JSON.stringify(orario)); renderOrario(); }
        }
        
        function selezionaGiorno(g) { giornoSel = g; renderOrario(); }
        
        function aggiungiDomanda() {
            const materia = document.getElementById('domanda-materia').value.trim();
            const testo = document.getElementById('domanda-testo').value.trim();
            if (!materia || !testo) { alert('Compila i campi'); return; }
            domande.push({ id: Date.now(), materia, testo });
            localStorage.setItem('flashlab_domande', JSON.stringify(domande));
            document.getElementById('domanda-materia').value = '';
            document.getElementById('domanda-testo').value = '';
            renderDomande();
        }
        
        function openSettings() {
            alert('⚙️ Flash Lab Uni v1.0\nby Tesi Flash\n\n🎯 Funzionalità:\n- Media ponderata\n- Voto laurea\n- AI Tutor\n- Obiettivo personalizzato');
        }
        
        // ============ INIT ============
        function initApp() {
            navigateTo('dashboard');
            document.getElementById('obiettivo-valore').textContent = obiettivoMedia;
        }
        
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
    
    <!-- ============ PWA INSTALLAZIONE ============ -->
    <script>
        // [CODICE PWA IDENTICO A QUELLO CHE HAI GIÀ - LO MANTENIAMO]
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('✅ SW registrato'))
                    .catch(err => console.error('❌ SW fallito'));
            });
        }
        
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            showInstallButton();
        });
        
        function showInstallButton() {
            const btn = document.createElement('button');
            btn.textContent = '📱 Installa App';
            btn.style.cssText = 'position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:#004a99; color:white; border:none; padding:14px 24px; border-radius:30px; font-weight:700; cursor:pointer; z-index:2000;';
            btn.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    await deferredPrompt.userChoice;
                    deferredPrompt = null;
                    btn.remove();
                }
            });
            document.body.appendChild(btn);
            setTimeout(() => { if (btn.parentNode) btn.remove(); }, 10000);
        }
    </script>
</body>
</html>
