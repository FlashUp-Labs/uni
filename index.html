<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flash Lab Uni · Libretto Universitario</title>

    <!-- ============ PWA META TAGS ============ -->
    <meta name="theme-color" content="#004a99">
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FlashLab">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23004a99'/%3E%3Ctext x='50' y='68' font-family='Arial' font-size='50' font-weight='bold' fill='white' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
    
    <style>
        /* ============================================================
           FLASH LAB UNI - CSS OPTIMIZED (Mobile-First, Leggero)
           ============================================================ */
        
        :root {
            --primary: #004a99;
            --primary-light: #1a6bc4;
            --primary-dark: #003366;
            --bg-main: #f0f2f5;
            --bg-card: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.85);
            --text-primary: #1a1a2e;
            --text-secondary: #5a5a7a;
            --text-muted: #8b8ba7;
            --accent-green: #22c55e;
            --accent-yellow: #f59e0b;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --border-light: #e5e7eb;
            --shadow-sm: 0 2px 8px rgba(0, 74, 153, 0.08);
            --shadow-md: 0 4px 16px rgba(0, 74, 153, 0.12);
            --shadow-lg: 0 8px 24px rgba(0, 74, 153, 0.16);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --tab-height: 64px;
            --header-height: 60px;
            --font-sans: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'SF Mono', 'Cascadia Code', monospace;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            font-size: 16px;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: var(--font-sans);
            background: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.6;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            padding-bottom: calc(var(--tab-height) + 20px);
        }
        
        /* ============ HEADER ============ */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--primary);
            color: white;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 12px rgba(0, 74, 153, 0.2);
            min-height: var(--header-height);
        }
        
        .app-header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: -0.3px;
        }
        
        .app-header .logo svg {
            width: 28px;
            height: 28px;
            fill: white;
        }
        
        .app-header .header-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .app-header .header-icon:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        
        .app-header .header-icon svg {
            width: 20px;
            height: 20px;
            fill: white;
        }
        
        /* ============ MAIN CONTENT ============ */
        .main-content {
            padding: 16px;
            animation: fadeIn 0.3s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* ============ TAB BAR ============ */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            height: var(--tab-height);
            background: var(--bg-card);
            border-top: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 8px;
            box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.06);
            z-index: 1000;
        }
        
        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 8px 12px;
            border: none;
            background: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.65rem;
            font-weight: 600;
            transition: var(--transition);
            position: relative;
            min-width: 52px;
        }
        
        .tab-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            transition: var(--transition);
        }
        
        .tab-item.active {
            color: var(--primary);
        }
        
        .tab-item.active::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 3px;
            background: var(--primary);
            border-radius: 0 0 3px 3px;
        }
        
        .tab-item:hover {
            color: var(--primary-light);
        }
        
        /* ============ CARDS ============ */
        .card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }
        
        .card:hover {
            box-shadow: var(--shadow-md);
        }
        
        .card-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .card-title svg {
            width: 20px;
            height: 20px;
            fill: var(--primary);
        }
        
        .card-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }
        
        /* ============ STATS ============ */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .stat-card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 16px;
            text-align: center;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
        }
        
        .stat-card .stat-value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1.2;
        }
        
        .stat-card .stat-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }
        
        /* ============ FORMS ============ */
        .form-group {
            margin-bottom: 14px;
        }
        
        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        
        .form-input, .form-select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--border-light);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            color: var(--text-primary);
            background: var(--bg-card);
            transition: var(--transition);
            outline: none;
            font-family: var(--font-sans);
        }
        
        .form-input:focus, .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 74, 153, 0.1);
        }
        
        .form-input::placeholder {
            color: var(--text-muted);
        }
        
        /* ============ BUTTONS ============ */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            width: 100%;
            font-family: var(--font-sans);
        }
        
        .btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        
        .btn-primary:hover {
            background: var(--primary-light);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        
        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }
        
        .btn-outline:hover {
            background: rgba(0, 74, 153, 0.05);
        }
        
        .btn-danger {
            background: var(--accent-red);
            color: white;
        }
        
        /* ============ ESAME ITEMS ============ */
        .exam-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            margin-bottom: 8px;
            box-shadow: var(--shadow-sm);
            border-left: 3px solid var(--primary);
            transition: var(--transition);
        }
        
        .exam-item:hover {
            box-shadow: var(--shadow-md);
            transform: translateX(2px);
        }
        
        .exam-item .exam-info {
            flex: 1;
        }
        
        .exam-item .exam-name {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-primary);
        }
        
        .exam-item .exam-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }
        
        .exam-item .exam-grade {
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--primary);
        }
        
        .exam-item .exam-actions {
            display: flex;
            gap: 6px;
        }
        
        .btn-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        
        .btn-icon svg {
            width: 16px;
            height: 16px;
            fill: var(--text-muted);
        }
        
        .btn-icon:hover {
            background: rgba(239, 68, 68, 0.1);
        }
        
        .btn-icon:hover svg {
            fill: var(--accent-red);
        }
        
        /* ============ CHART (SVG Bars) ============ */
        .chart-container {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 160px;
            padding: 16px 8px;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            overflow-x: auto;
        }
        
        .chart-bar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            min-width: 32px;
        }
        
        .chart-bar {
            width: 100%;
            max-width: 28px;
            background: var(--primary);
            border-radius: 4px 4px 0 0;
            transition: var(--transition);
            cursor: pointer;
            position: relative;
        }
        
        .chart-bar:hover {
            background: var(--primary-light);
            transform: scaleY(1.05);
        }
        
        .chart-bar-label {
            font-size: 0.6rem;
            color: var(--text-muted);
            margin-top: 4px;
            text-align: center;
        }
        
        /* ============ FILTERS ============ */
        .filter-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        
        .filter-chip {
            padding: 6px 12px;
            border-radius: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            color: var(--text-secondary);
        }
        
        .filter-chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        
        /* ============ TIMELINE ============ */
        .timeline {
            position: relative;
            padding-left: 24px;
        }
        
        .timeline::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 4px;
            bottom: 4px;
            width: 2px;
            background: var(--border-light);
        }
        
        .timeline-item {
            position: relative;
            margin-bottom: 16px;
            padding-left: 12px;
        }
        
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -20px;
            top: 4px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--primary);
            border: 2px solid white;
            box-shadow: 0 0 0 2px var(--primary);
        }
        
        /* ============ TASSE ============ */
        .tassa-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            margin-bottom: 8px;
            box-shadow: var(--shadow-sm);
            border-left: 3px solid var(--accent-yellow);
            transition: var(--transition);
        }
        
        .tassa-item.pagata {
            border-left-color: var(--accent-green);
            opacity: 0.7;
        }
        
        .tassa-item .tassa-status {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        
        .tassa-item .tassa-status .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-yellow);
        }
        
        .tassa-item.pagata .tassa-status .status-dot {
            background: var(--accent-green);
        }
        
        /* ============ ORARIO ============ */
        .orario-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            margin-bottom: 8px;
            box-shadow: var(--shadow-sm);
        }
        
        .orario-item .orario-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        
        .orario-item.universitario .orario-dot {
            background: var(--primary);
        }
        
        .orario-item.extra .orario-dot {
            background: var(--accent-purple);
        }
        
        /* ============ RESPONSIVE ============ */
        @media (min-width: 480px) {
            body {
                box-shadow: 0 0 40px rgba(0, 0, 0, 0.1);
            }
        }
        
        @media (max-width: 360px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .app-header {
                padding: 12px 16px;
            }
            
            .main-content {
                padding: 12px;
            }
        }
        
        /* ============ UTILITY ============ */
        .hidden {
            display: none !important;
        }
        
        .text-center {
            text-align: center;
        }
        
        .mt-8 {
            margin-top: 8px;
        }
        
        .mt-16 {
            margin-top: 16px;
        }
        
        .mb-16 {
            margin-bottom: 16px;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }
        
        .empty-state svg {
            width: 48px;
            height: 48px;
            fill: var(--text-muted);
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <!-- TUTTO IL RESTO DEL BODY È UGUALE -->
    
    <!-- ============================================================
         PWA - REGISTRAZIONE SERVICE WORKER (UN SOLO SCRIPT!)
         ============================================================ -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registration) => {
                        console.log('✅ Service Worker registrato:', registration.scope);
                    })
                    .catch((error) => {
                        console.error('❌ Service Worker fallito:', error);
                    });
            });
        }
        
        let deferredPrompt;
        
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            showInstallButton();
        });
        
        function showInstallButton() {
            const btn = document.createElement('button');
            btn.textContent = '📱 Installa App';
            btn.style.cssText = `
                position: fixed;
                bottom: 80px;
                left: 50%;
                transform: translateX(-50%);
                background: #004a99;
                color: white;
                border: none;
                padding: 14px 24px;
                border-radius: 30px;
                font-weight: 700;
                font-size: 0.9rem;
                cursor: pointer;
                box-shadow: 0 8px 24px rgba(0, 74, 153, 0.4);
                z-index: 2000;
            `;
            
            btn.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const result = await deferredPrompt.userChoice;
                    console.log('📱 Scelta:', result.outcome);
                    deferredPrompt = null;
                    btn.remove();
                }
            });
            
            document.body.appendChild(btn);
            
            setTimeout(() => {
                if (btn.parentNode) btn.remove();
            }, 10000);
        }
    </script>
</body>
</html>
